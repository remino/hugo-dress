<header>
  <h1>
    {{ $home := relLangURL "/" }}
    <a href="{{ $home }}">
      {{ with site.Params.dress.logo }}
        {{ with .src }}
          {{ $logo := site.Params.dress.logo }}
          {{ $alt := $logo.alt | default "" }}
          <img src="{{ . | relURL }}" alt="{{ $alt }}"{{ with $logo.width }} width="{{ . }}"{{ end }}{{ with $logo.height }} height="{{ . }}"{{ end }}>
        {{ end }}
      {{ end }}
      {{ site.Title }}
    </a>
  </h1>
  {{ with site.Menus.main }}
    <nav aria-label="Main">
      <ul>
        {{ range . }}
          <li>
            <a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
          </li>
        {{ end }}
      </ul>
    </nav>
  {{ end }}
</header>
