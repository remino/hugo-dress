<footer>
  {{ with site.Menus.footer }}
    <nav aria-label="Footer">
      <ul>
        {{ range . }}
          {{ $url := .URL }}
          {{ if not (hasPrefix $url "#") }}
            {{ $url = $url | relLangURL }}
          {{ end }}
          <li><a href="{{ $url }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  {{ end }}
</footer>
